[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-assistant-agent-lite"
version = "1.7.0"
description = "ChatGPT-like lightweight desktop assistant powered by Hammer 2.1 local Smart Agent tool routing."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<46",
  "platformdirs>=4.3,<5",
  "requests>=2.32,<3",
  "playwright>=1.49,<2",
]

[project.scripts]
your-assistant-agent = "yaa_lite.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# One personal relay, one replica. Review Render's current plan price before deployment.
services:
  - type: web
    name: yourassistant-relay
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: relay_server
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: RELAY_BIND
        value: 0.0.0.0
      - key: RELAY_ENROLLMENT_KEY
        generateValue: true

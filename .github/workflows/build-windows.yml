name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: your-assistant-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed-ready Windows Setup
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Important: a workflow run checks out the exact commit that triggered it.
      # If that historical commit still contained the legacy workflow, remove it
      # from THIS checkout before the packaging tests run. The repository itself
      # is already cleaned and now contains only build-windows.yml.
      - name: Ignore legacy workflow from triggering commit
        shell: pwsh
        run: |
          Remove-Item ".github\workflows\windows-build.yml" -Force -ErrorAction SilentlyContinue
          $remaining = @(Get-ChildItem ".github\workflows" -Filter "*.yml" | Select-Object -ExpandProperty Name)
          Write-Host "Workflow files in build checkout: $($remaining -join ', ')"
          if ($remaining.Count -ne 1 -or $remaining[0] -ne 'build-windows.yml') {
            throw "Expected exactly one active workflow: build-windows.yml"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify Smart Agent dependencies
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -c "import playwright; from yaa_lite.agent.hammer_agent import HammerAgentRouter; from yaa_lite.agent.tools import ToolRegistry; print('Hammer Smart Agent dependencies OK')"

      - name: Run source startup self-test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python launcher.py --self-test

      - name: Download and verify local AI models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          $m = Get-Content models.manifest.json | ConvertFrom-Json
          foreach ($x in $m.models) {
            $dest = Join-Path models $x.filename
            Invoke-WebRequest -Uri $x.url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $x.sha256.ToLower()) { throw "SHA256 mismatch: $($x.filename)" }
          }

      - name: Download llama.cpp Windows x64 CPU runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          $headers = @{
            'User-Agent' = 'YourAssistantAgent-Build'
            'Accept' = 'application/vnd.github+json'
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30'
          $asset = $null
          foreach ($release in $releases) {
            if ($release.draft) { continue }
            $candidate = $release.assets | Where-Object {
              $_.name -match '^llama-b[0-9]+-bin-win-cpu-x64[.]zip$' -or
              $_.name -match '^llama-.*-bin-win-cpu-x64[.]zip$'
            } | Select-Object -First 1
            if ($candidate) { $asset = $candidate; break }
          }
          if (-not $asset) {
            $downloadUrl = 'https://github.com/ggml-org/llama.cpp/releases/download/b11635/llama-b11635-bin-win-cpu-x64.zip'
          } else {
            $downloadUrl = $asset.browser_download_url
          }
          Invoke-WebRequest -Headers $headers -Uri $downloadUrl -OutFile llama.zip -UseBasicParsing
          Remove-Item llama_tmp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive llama.zip -DestinationPath llama_tmp -Force
          $server = Get-ChildItem llama_tmp -Recurse -Filter 'llama-server.exe' | Select-Object -First 1
          if (-not $server) { throw 'llama-server.exe is missing from downloaded llama.cpp archive' }
          Copy-Item $server.FullName runtime\llama-server.exe -Force
          Get-ChildItem llama_tmp -Recurse -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName runtime\ -Force }

      - name: Run current tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m pytest -q

      - name: Build app folder
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean build_app.spec

      - name: Verify packaged EXE starts cleanly
        shell: pwsh
        run: |
          $exe = "$PWD\dist\YourAssistantAgent\YourAssistantAgent.exe"
          if (-not (Test-Path $exe)) { throw 'YourAssistantAgent.exe was not created' }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged startup self-test failed with exit code $($p.ExitCode)" }

      - name: Optional Authenticode sign application EXE
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host 'No code-signing certificate configured; EXE will remain unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'yaa-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD "$PWD\dist\YourAssistantAgent\YourAssistantAgent.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Application signing failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found' }
          & $iscc installer\YourAssistantAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Optional Authenticode sign Setup EXE
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host 'No code-signing certificate configured; Setup will remain unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'yaa-signing.pfx'
          if (-not (Test-Path $pfx)) { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)) }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          $setup = Get-ChildItem "$PWD\output\*.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE was not created' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Setup signing failed' }

      - name: Create SHA256
        shell: pwsh
        run: |
          $f = Get-ChildItem output\*.exe | Select-Object -First 1
          if (-not $f) { throw 'Installer EXE was not created' }
          $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($f.Name)" | Set-Content ($f.FullName + '.sha256.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Windows-Setup
          path: |
            output/*.exe
            output/*.sha256.txt
          if-no-files-found: error
          retention-days: 30

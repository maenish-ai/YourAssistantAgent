name: Build Your Assistant Agent for Windows

on:
  push:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Setup
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment
        shell: pwsh
        run: py -3.12 -m venv .venv

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Preflight required application modules
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .\.venv\Scripts\python.exe -c "import your_assistant_agent.github_deploy; import your_assistant_agent.local_ai_runtime; import your_assistant_agent.ui; print('Required modules OK')"

      - name: Cache bundled Local AI assets
        uses: actions/cache@v4
        with:
          path: assets/local_ai
          key: local-ai-dual-qwen3-0.6b-rightnow-arabic-0.5b-llama-b11429-v2

      - name: Prepare free bundled Local AI
        shell: pwsh
        run: ./scripts/prepare_local_ai.ps1

      - name: Verify Local AI bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "assets\local_ai\runtime\llama-server.exe")) { throw "llama-server.exe missing" }
          if (-not (Test-Path "assets\local_ai\models\Qwen3-0.6B-Q4_0.gguf")) { throw "General Local AI model missing" }
          if (-not (Test-Path "assets\local_ai\models\RightNow-Arabic-0.5B-Turbo-q4_k_m.gguf")) { throw "Arabic Local AI model missing" }
          $generalSize = (Get-Item "assets\local_ai\models\Qwen3-0.6B-Q4_0.gguf").Length
          $arabicSize = (Get-Item "assets\local_ai\models\RightNow-Arabic-0.5B-Turbo-q4_k_m.gguf").Length
          if ($generalSize -lt 400MB) { throw "General Local AI model is unexpectedly small" }
          if ($arabicSize -lt 390MB) { throw "Arabic Local AI model is unexpectedly small" }

      - name: Install Playwright Chromium fallback into app assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\playwright-browsers" | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\assets\playwright-browsers"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Build application with PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name YourAssistantAgent `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --collect-all playwright `
            app.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\YourAssistantAgent\YourAssistantAgent.exe")) {
            throw "YourAssistantAgent.exe was not created."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc "installer\YourAssistantAgent.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Windows-Setup
          path: release/YourAssistantAgent-Setup.exe
          if-no-files-found: error
          retention-days: 30

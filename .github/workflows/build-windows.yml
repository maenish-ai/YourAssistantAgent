name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: your-assistant-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GroqCloud Personal Assistant Windows Setup
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ignore legacy workflow from triggering commit
        shell: pwsh
        run: |
          Remove-Item ".github\workflows\windows-build.yml" -Force -ErrorAction SilentlyContinue
          $remaining = @(Get-ChildItem ".github\workflows" -Filter "*.yml" | Select-Object -ExpandProperty Name)
          Write-Host "Workflow files in build checkout: $($remaining -join ', ')"
          if ($remaining.Count -ne 1 -or $remaining[0] -ne 'build-windows.yml') {
            throw "Expected exactly one active workflow: build-windows.yml"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify cloud-agent and voice dependencies
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -c "import requests, sounddevice, playwright; from yaa_lite.ai.runtime import GROQ_MODEL; print(GROQ_MODEL); print('GroqCloud + voice dependencies OK')"

      - name: Run source startup self-test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python launcher.py --self-test

      - name: Download Piper and Jordanian Arabic voice
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime\piper | Out-Null
          New-Item -ItemType Directory -Force models\voice | Out-Null
          $headers = @{ 'User-Agent' = 'YourAssistantAgent-Build' }
          Invoke-WebRequest -Headers $headers -Uri 'https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip' -OutFile piper.zip -UseBasicParsing
          Remove-Item piper_tmp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive piper.zip -DestinationPath piper_tmp -Force
          $piper = Get-ChildItem piper_tmp -Recurse -Filter 'piper.exe' | Select-Object -First 1
          if (-not $piper) { throw 'piper.exe is missing' }
          Copy-Item (Join-Path $piper.Directory.FullName '*') runtime\piper\ -Recurse -Force

          $voice = 'models\voice\ar_JO-kareem-medium.onnx'
          $voiceJson = 'models\voice\ar_JO-kareem-medium.onnx.json'
          Invoke-WebRequest -Uri 'https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx?download=true' -OutFile $voice -UseBasicParsing
          Invoke-WebRequest -Uri 'https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json?download=true' -OutFile $voiceJson -UseBasicParsing
          $vsha = (Get-FileHash $voice -Algorithm SHA256).Hash.ToLower()
          $jmd5 = (Get-FileHash $voiceJson -Algorithm MD5).Hash.ToLower()
          if ($vsha -ne '9e95cab07b679da603bba17c4dec7ab3111320571964ee95c0379603c086491e') { throw "Piper voice SHA256 mismatch: $vsha" }
          if ($jmd5 -ne 'dd70b31eb5a395907241b1e5367ace3a') { throw "Piper voice config MD5 mismatch: $jmd5" }

      - name: Run current tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m pytest -q

      - name: Verify runtime payload
        shell: pwsh
        run: |
          if (-not (Test-Path 'runtime\piper\piper.exe')) { throw 'Piper missing' }
          if (-not (Test-Path 'models\voice\ar_JO-kareem-medium.onnx')) { throw 'Arabic Piper voice missing' }
          if (Test-Path 'models\Qwen3-1.7B-Q4_K_M.gguf') { throw 'Local Qwen model must not be packaged in cloud build' }
          if (Test-Path 'runtime\llama-server.exe') { throw 'llama.cpp must not be packaged in cloud build' }
          if (Test-Path 'runtime\whisper\whisper-cli.exe') { throw 'local Whisper must not be packaged in cloud build' }

      - name: Build app folder
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean build_app.spec

      - name: Verify packaged EXE starts cleanly
        shell: pwsh
        run: |
          $exe = "$PWD\dist\YourAssistantAgent\YourAssistantAgent.exe"
          if (-not (Test-Path $exe)) { throw 'YourAssistantAgent.exe was not created' }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged startup self-test failed with exit code $($p.ExitCode)" }

      - name: Optional Authenticode sign application EXE
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host 'No code-signing certificate configured; EXE will remain unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'yaa-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD "$PWD\dist\YourAssistantAgent\YourAssistantAgent.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Application signing failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found' }
          & $iscc installer\YourAssistantAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Optional Authenticode sign Setup EXE
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host 'No code-signing certificate configured; Setup will remain unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'yaa-signing.pfx'
          if (-not (Test-Path $pfx)) { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)) }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          $setup = Get-ChildItem "$PWD\output\*.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE was not created' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Setup signing failed' }

      - name: Create SHA256
        shell: pwsh
        run: |
          $f = Get-ChildItem output\*.exe | Select-Object -First 1
          if (-not $f) { throw 'Installer EXE was not created' }
          $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($f.Name)" | Set-Content ($f.FullName + '.sha256.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Windows-Setup-GroqCloud
          path: |
            output/*.exe
            output/*.sha256.txt
          if-no-files-found: error
          retention-days: 30

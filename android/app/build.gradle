plugins { id 'com.android.application' }

android {
    namespace 'ai.maenish.yourassistant'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.maenish.yourassistant'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.6.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.includeAndroidResources = true
        // Robolectric's test-only TLS provider reflects on JDK 17 InetAddress.
        unitTests.all { jvmArgs '--add-opens=java.base/java.net=ALL-UNNAMED' }
    }
    signingConfigs {
        release {
            if (System.getenv('YAA_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('YAA_ANDROID_KEYSTORE'))
                storePassword System.getenv('YAA_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('YAA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('YAA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('YAA_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // AndroidX pulls Kotlin transitively even though this app is Java. Align
    // the pre/post-1.8 JDK stdlib artifacts to avoid duplicate APK classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing 4.3's published POM omits these runtime references. IntentIntegrator
    // uses FragmentActivity, and CaptureManager uses core permission helpers.
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

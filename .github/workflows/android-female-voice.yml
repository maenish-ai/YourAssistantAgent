name: Build Android with bundled female voice
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tools/prepare_bundled_female_voice.py'
      - '.github/workflows/android-female-voice.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model converter
        run: python -m pip install 'onnx==1.17.0'
      - uses: android-actions/setup-android@v3
      - name: Build APK (download and embed voice)
        working-directory: android
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Verify bundled voice
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -l "$APK" | grep -E 'assets/voice/arabic-female/(model.onnx|tokens.txt)'
      - uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Android-Female-Voice-Debug
          path: android/app/build/outputs/apk/debug/*.apk

name: Build Android Companion

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: your-assistant-agent-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android companion
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the retired SDK package "tools".
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bundled voice model converter
        run: python -m pip install 'onnx==1.17.0'
      - name: Restore private Android release key when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PYKEY'
          import base64, os
          from pathlib import Path
          encoded=os.environ.get('ANDROID_KEYSTORE_BASE64','')
          if encoded:
              path=Path(os.environ['RUNNER_TEMP'])/'yourassistant-release.jks'
              path.write_bytes(base64.b64decode(encoded,validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as output:
                  output.write('YAA_ANDROID_KEYSTORE='+str(path)+'\n')
          PYKEY
      - name: Test, lint and build Android companion
        env:
          YAA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          YAA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YAA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$YAA_ANDROID_KEYSTORE" ]; then
            gradle -p android --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          else
            gradle -p android --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          fi
      - name: Upload signed Android release
        if: env.YAA_ANDROID_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Android-Release-v1.8.10
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove private Android key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/yourassistant-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Android-Debug-v1.8.10
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

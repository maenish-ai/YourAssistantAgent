name: Build Your Assistant Agent for Windows

on:
  push:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment
        shell: pwsh
        run: py -3.12 -m venv .venv

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Install Playwright Chromium into app assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\playwright-browsers" | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\assets\playwright-browsers"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Build application with PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name YourAssistantAgent `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --collect-all playwright `
            app.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\YourAssistantAgent\YourAssistantAgent.exe")) {
            throw "YourAssistantAgent.exe was not created."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Compress-Archive `
            -Path "dist\YourAssistantAgent\*" `
            -DestinationPath "release\YourAssistantAgent-Windows-Portable.zip" `
            -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc "installer\YourAssistantAgent.iss"

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Windows-Portable
          path: release/YourAssistantAgent-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: YourAssistantAgent-Windows-Setup
          path: release/YourAssistantAgent-Setup.exe
          if-no-files-found: error
          retention-days: 30

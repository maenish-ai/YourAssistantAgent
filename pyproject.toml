[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-assistant-agent-lite"
version = "4.4.0"
description = "Lightweight Windows desktop assistant with GroqCloud and opt-in local tools."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<46",
  "platformdirs>=4.3,<5",
  "requests>=2.32,<3",
  "playwright>=1.49,<2",
  "pystray>=0.19,<0.20",
  "Pillow>=10,<12",
  "sounddevice>=0.5,<0.6",
]

[project.scripts]
your-assistant-agent = "yaa_lite.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
